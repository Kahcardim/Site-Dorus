<!doctype html>
<html lang="pt-BR">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#0d3b8e">
  <title>Página não encontrada | D’orus Assistência Técnica</title>
<link rel="stylesheet" href="/Site-Dorus/styles.css?v=20260828-qa2">
  <link rel="stylesheet" href="layout.css?v=20260828-qa2">
<style>
    .error-page{min-height:72vh;display:grid;place-items:center;padding:60px 0;background:radial-gradient(circle at 80% 10%,rgba(22,182,232,.18),transparent 30%),linear-gradient(180deg,#eef6ff,#fff)}
    .error-card{width:min(760px,100%);text-align:center;padding:clamp(34px,6vw,54px) clamp(20px,5vw,34px);border:1px solid var(--line);border-radius:28px;background:#fff;box-shadow:var(--shadow)}
    .error-code{font-size:clamp(4.6rem,15vw,8rem);line-height:1;font-weight:900;color:var(--primary);letter-spacing:-.07em;margin:0}
    .error-card h1{color:var(--dark);font-size:clamp(1.8rem,4vw,2.7rem);margin:12px 0}
    .error-card p{color:var(--muted);max-width:560px;margin:0 auto}
    .error-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}
    @media(max-width:560px){.error-actions{display:grid;grid-template-columns:1fr;width:100%}.error-actions .button{width:100%}}
  </style>
  <link rel="icon" href="assets/dorus-logo-3d.webp" type="image/webp">
  <link rel="apple-touch-icon" href="assets/dorus-logo-3d.webp">
</head>
<body>
  <main class="error-page">
    <div class="container">
      <section class="error-card" aria-labelledby="error-title">
        <p class="error-code" aria-hidden="true">404</p>
        <span class="eyebrow">Página não encontrada</span>
        <h1 id="error-title">Esse endereço não existe ou foi alterado.</h1>
        <p>Você pode voltar para a página inicial ou falar diretamente com a D’orus pelo WhatsApp.</p>
        <div class="error-actions">
          <a class="button button-blue" href="/Site-Dorus/">Voltar ao início</a>
          <a class="button button-green" href="https://wa.me/5511913573932?text=Olá%2C%20vim%20pelo%20site%20da%20D%27orus%20e%20gostaria%20de%20atendimento." target="_blank" rel="noopener noreferrer">Abrir WhatsApp</a>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
