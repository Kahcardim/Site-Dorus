name: Teste temporario Apps Script

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apps-script-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Validar endpoint publicado
        shell: bash
        run: |
          BASE='https://script.google.com/macros/s/AKfycbySQLF-zmEA9Pjx3-or9ZYb84FQYXzphMmDLm464tWWKv7Zial1dZoTcz6qw8pwZPNh/exec'
          STATUS="$(curl -fsSL --retry 3 "$BASE?action=status")"
          echo "$STATUS"
          printf '%s' "$STATUS" | grep -q '"ok":true'
          printf '%s' "$STATUS" | grep -q 'Dorus Agendamento'

          AVAIL="$(curl -fsSL --retry 3 "$BASE?action=availability&date=2026-08-31")"
          echo "$AVAIL"
          printf '%s' "$AVAIL" | grep -q '"ok":true'
          printf '%s' "$AVAIL" | grep -q '"slots"'

          BRIDGE="$(curl -fsSL --retry 3 "$BASE?action=bridge")"
          printf '%s' "$BRIDGE" | grep -q 'dorus-calendar-bridge'
          echo 'Apps Script publicado e respondendo corretamente.'
