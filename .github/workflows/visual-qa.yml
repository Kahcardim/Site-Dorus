name: QA visual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar navegador de teste
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Aguardar a mesma revisao no Pages
        shell: bash
        run: |
          VERSION="${GITHUB_SHA:0:12}"
          for i in $(seq 1 60); do
            HTML="$(curl -fsSL --retry 2 "https://assistenciadorus.com.br/?qa=${GITHUB_SHA}&t=${i}" || true)"
            if printf '%s' "$HTML" | grep -q "?v=${VERSION}"; then
              echo "Pages confirmado em ${VERSION}."
              exit 0
            fi
            sleep 5
          done
          echo "Pages nao apresentou a revisao ${VERSION}."
          exit 1

      - name: Rodar regressao visual responsiva
        shell: bash
        run: |
          mkdir -p visual-qa/screenshots
          cat > visual-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const base='https://assistenciadorus.com.br/';
          const pages=[
            ['','home'],['sobre/','sobre'],['servicos/','servicos'],['curiosidades/','curiosidades'],
            ['agendamento/','agendamento'],['fale-conosco/','fale-conosco'],['privacidade/','privacidade'],
            ['servicos/geladeiras/','geladeiras'],['servicos/maquinas-de-lavar/','maquinas-de-lavar'],
            ['servicos/fogoes/','fogoes'],['servicos/freezers/','freezers'],['servicos/lava-loucas/','lava-loucas'],
            ['servicos/lava-e-seca/','lava-e-seca'],['servicos/fornos/','fornos'],['servicos/micro-ondas/','micro-ondas']
          ];
          const sizes=[['mobile-360',360,800],['mobile-390',390,844],['tablet-768',768,1024],['desktop-1366',1366,768],['desktop-1920',1920,1080]];
          const browser=await chromium.launch({headless:true});
          const report=[];

          for(const [size,w,h] of sizes){
            const context=await browser.newContext({viewport:{width:w,height:h}});
            let cookieChecked=false;
            for(const [route,name] of pages){
              const page=await context.newPage();
              const runtime=[];
              page.on('pageerror',e=>runtime.push({kind:'pageerror',text:e.message}));
              page.on('console',m=>{if(m.type()==='error')runtime.push({kind:'console',text:m.text()})});
              let status=0;
              try{
                const res=await page.goto(base+route+'?visual='+Date.now(),{waitUntil:'domcontentloaded',timeout:20000});
                status=res?.status()||0;
                await page.waitForTimeout(850);
                if(!cookieChecked){
                  const banner=page.locator('[data-cookie-banner]');
                  if(!(await banner.isVisible().catch(()=>false))) runtime.push({kind:'site',text:'Banner de cookies nao apareceu na primeira visita'});
                  const essential=page.locator('[data-cookie-essential]');
                  if(await essential.isVisible().catch(()=>false)) await essential.click();
                  cookieChecked=true;
                }
                await page.evaluate(async()=>{
                  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
                  const max=document.documentElement.scrollHeight;
                  for(let y=0;y<max;y+=Math.max(420,innerHeight*.75)){scrollTo(0,y);await sleep(70)}
                  scrollTo(0,0);await sleep(250);
                });
              }catch(e){runtime.push({kind:'navigation',text:e.message})}

              const externalErrors=name==='agendamento'
                ? runtime.filter(e=>e.kind==='console'&&/403/.test(e.text))
                : [];
              const errors=runtime.filter(e=>!externalErrors.includes(e));

              const m=await page.evaluate(()=>{
                const visible=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0};
                const overflow=Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth;
                const clipped=[];
                for(const e of document.querySelectorAll('h1,h2,h3,h4,p,a,strong,small,label,summary,button')){
                  if(!visible(e)||!e.textContent.trim())continue;
                  const s=getComputedStyle(e),bad=e.scrollWidth>e.clientWidth+2||e.scrollHeight>e.clientHeight+2;
                  if(bad&&/(hidden|clip)/.test(s.overflow+s.overflowX+s.overflowY))clipped.push(e.textContent.trim().slice(0,80));
                }
                const badImages=[...document.images].filter(i=>i.complete&&i.naturalWidth===0).map(i=>i.currentSrc||i.src);
                const criticalImages=[...document.querySelectorAll('.hero-media img,.service-hero-media img,.brand-logo img,img.logo,.footer img')]
                  .filter(visible)
                  .map(i=>({src:i.currentSrc||i.src,fit:getComputedStyle(i).objectFit,natural:[i.naturalWidth,i.naturalHeight],box:[Math.round(i.getBoundingClientRect().width),Math.round(i.getBoundingClientRect().height)]}));
                const croppedCriticalImages=criticalImages.filter(i=>i.fit==='cover'&&i.natural[0]&&i.natural[1]&&i.box[0]&&i.box[1]&&Math.abs((i.natural[0]/i.natural[1])-(i.box[0]/i.box[1]))>.08);
                const reviews=[...document.querySelectorAll('.review-card')].map(e=>Math.round(e.getBoundingClientRect().width));
                const serviceHero=document.querySelector('.service-hero-media img');
                const h1=document.querySelector('h1');
                const hero=document.querySelector('.hero'),copy=document.querySelector('.hero-copy'),media=document.querySelector('.hero-media'),pic=document.querySelector('.hero-media picture'),img=document.querySelector('.hero-media img');
                let heroFit=null;
                if(hero&&copy&&media&&pic&&img){
                  const hr=hero.getBoundingClientRect(),cr=copy.getBoundingClientRect(),mr=media.getBoundingClientRect(),pr=pic.getBoundingClientRect(),ir=img.getBoundingClientRect(),style=getComputedStyle(img);
                  heroFit={heroTop:Math.round(hr.top),heroBottom:Math.round(hr.bottom),contentBottom:Math.round(Math.max(cr.bottom,mr.bottom)),media:Math.round(mr.width),picture:[Math.round(pr.width),Math.round(pr.height)],image:[Math.round(ir.width),Math.round(ir.height)],natural:[img.naturalWidth,img.naturalHeight],objectFit:style.objectFit,objectPosition:style.objectPosition};
                }
                return {
                  overflow,clipped,badImages,croppedCriticalImages,reviews,heroFit,
                  h1:!!h1,h1Size:h1?parseFloat(getComputedStyle(h1).fontSize):0,
                  serviceImageWidth:serviceHero?Math.round(serviceHero.getBoundingClientRect().width):0,
                  a11yLauncher:!!document.querySelector('[data-a11y-launcher]'),
                  cookieSettings:!!document.querySelector('[data-cookie-settings]')
                };
              });

              if(['home','servicos','fale-conosco','agendamento','geladeiras','privacidade'].includes(name))
                await page.screenshot({path:`visual-qa/screenshots/${size}-${name}.png`,fullPage:true});

              const desktopReviewBad=name==='home'&&w>=1200&&m.reviews.some(x=>x<280);
              const heroCropBad=name==='home'&&m.heroFit&&m.heroFit.objectFit!=='contain';
              const desktopTitleBad=name==='home'&&size==='desktop-1366'&&m.h1Size>48;
              const mobileTitleBad=name==='home'&&w<=390&&m.h1Size>40;
              const lowDesktopHeroBad=name==='home'&&size==='desktop-1366'&&m.heroFit&&m.heroFit.contentBottom>h+4;
              const serviceImageBad=!['servicos','home','sobre','curiosidades','agendamento','fale-conosco','privacidade'].includes(name)&&m.serviceImageWidth>360;
              const imageCropBad=m.croppedCriticalImages.length>0;
              const failed=Boolean(status!==200||errors.length||m.overflow>2||m.clipped.length||m.badImages.length||!m.h1||!m.a11yLauncher||!m.cookieSettings||desktopReviewBad||heroCropBad||desktopTitleBad||mobileTitleBad||lowDesktopHeroBad||serviceImageBad||imageCropBad);
              report.push({size,page:name,status,errors,externalErrors,...m,desktopReviewBad,heroCropBad,desktopTitleBad,mobileTitleBad,lowDesktopHeroBad,serviceImageBad,imageCropBad,failed});
              console.log(size,name,{status,errors:errors.length,externalErrors:externalErrors.length,overflow:m.overflow,clip:m.clipped.length,badImages:m.badImages.length,croppedImages:m.croppedCriticalImages.length,failed});
              await page.close();
            }
            await context.close();
          }
          await browser.close();
          fs.writeFileSync('visual-qa/report.json',JSON.stringify(report,null,2));
          const failures=report.filter(x=>x.failed);
          const external=report.filter(x=>x.externalErrors.length).map(x=>({size:x.size,page:x.page,errors:x.externalErrors}));
          fs.writeFileSync('visual-qa/failures.json',JSON.stringify(failures,null,2));
          fs.writeFileSync('visual-qa/external-backend-errors.json',JSON.stringify(external,null,2));
          console.log(`Cenarios: ${report.length}; falhas visuais/site: ${failures.length}; sinais externos de backend: ${external.length}`);
          if(failures.length)process.exitCode=1;
          EOF
          node visual-qa.mjs

      - name: Validar Home agenda formularios e acessibilidade
        if: always()
        shell: bash
        run: |
          cat > functional-smoke.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const base='https://assistenciadorus.com.br/';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:1366,height:768}});
          const failures=[];
          const evidence={};
          const fail=(area,message)=>failures.push(`${area}: ${message}`);

          // Home: acima da dobra, banner, estrelas, menu e conversao.
          {
            const page=await context.newPage();
            const runtime=[];
            page.on('pageerror',e=>runtime.push(e.message));
            page.on('console',m=>{if(m.type()==='error')runtime.push(m.text())});
            const res=await page.goto(base+'?functional='+Date.now(),{waitUntil:'domcontentloaded',timeout:20000});
            await page.waitForTimeout(1000);
            const essential=page.locator('[data-cookie-essential]');
            if(await essential.isVisible().catch(()=>false))await essential.click();
            const home=await page.evaluate(()=>{
              const visible=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0};
              const inViewport=e=>{if(!visible(e))return false;const r=e.getBoundingClientRect();return r.top>=-2&&r.top<innerHeight&&r.left<innerWidth&&r.right>0};
              const h1=document.querySelector('.hero h1'),img=document.querySelector('.hero-media img'),points=document.querySelector('.hero-points'),hero=document.querySelector('.hero');
              const agenda=[...document.querySelectorAll('.hero .button')].find(a=>(a.getAttribute('href')||'').includes('agendamento'));
              const whatsapp=document.querySelector('.whatsapp-mini');
              return {h1:inViewport(h1),image:inViewport(img)&&img.complete&&img.naturalWidth>0&&getComputedStyle(img).objectFit==='contain',stars:inViewport(points)&&/4,5\s*★/.test(points.textContent),nav:visible(document.querySelector('.nav')),whatsapp:visible(whatsapp)&&(whatsapp.href||'').includes('wa.me/5511913573932'),agenda:visible(agenda),heroBottom:hero?Math.round(hero.getBoundingClientRect().bottom):9999,skip:!!document.querySelector('.skip-link[href="#conteudo"]'),a11y:!!document.querySelector('[data-a11y-launcher]')};
            });
            evidence.home={status:res?.status(),runtime,...home};
            if(res?.status()!==200)fail('Home','HTTP diferente de 200');
            if(runtime.length)fail('Home','erros de runtime: '+runtime.join(' | '));
            for(const key of ['h1','image','stars','nav','whatsapp','agenda','skip','a11y'])if(!home[key])fail('Home',`criterio nao atendido: ${key}`);
            if(home.heroBottom>772)fail('Home',`hero ultrapassa a dobra em 1366x768 (${home.heroBottom}px)`);
            const skip=page.locator('.skip-link');await skip.focus();
            if(!(await skip.evaluate(el=>document.activeElement===el)))fail('Acessibilidade','skip-link nao recebe foco');
            await page.screenshot({path:'visual-qa/screenshots/acceptance-home-1366.png',fullPage:false});
            await page.close();
          }

          // Agenda: cliente/formulario e disponibilidade online, sem criar evento.
          {
            const page=await context.newPage();
            const runtime=[];
            page.on('pageerror',e=>runtime.push(e.message));
            page.on('console',m=>{if(m.type()==='error')runtime.push(m.text())});
            const res=await page.goto(base+'agendamento/?functional='+Date.now(),{waitUntil:'domcontentloaded',timeout:20000});
            await page.waitForTimeout(700);
            const form=page.locator('[data-schedule-form]');
            if(!(await form.count()))fail('Agenda','formulario nao encontrado');
            else if(await form.evaluate(el=>el.checkValidity()))fail('Agenda','formulario vazio foi considerado valido');
            const constraints=await page.evaluate(()=>{const input=document.querySelector('input[name="data"]');return{min:input?.min||'',max:input?.max||''}});
            if(!constraints.min||!constraints.max)fail('Agenda','data sem min/max');
            if(constraints.min&&constraints.max){const diff=Math.round((new Date(constraints.max+'T12:00:00')-new Date(constraints.min+'T12:00:00'))/86400000);if(diff!==60)fail('Agenda',`janela esperada 60 dias, encontrada ${diff}`)}
            const sunday=await page.evaluate(()=>{const d=new Date();d.setHours(12,0,0,0);for(let i=1;i<=14;i++){const x=new Date(d);x.setDate(d.getDate()+i);if(x.getDay()===0)return x.toISOString().slice(0,10)}return''});
            await page.locator('input[name="data"]').fill(sunday);await page.locator('input[name="data"]').dispatchEvent('input');await page.locator('input[name="data"]').dispatchEvent('change');
            if(await page.locator('input[name="data"]').evaluate(el=>el.checkValidity()))fail('Agenda','domingo nao foi bloqueado');
            const validDate=await page.evaluate(()=>{const d=new Date();d.setHours(12,0,0,0);for(let i=14;i<=30;i++){const x=new Date(d);x.setDate(d.getDate()+i);if(x.getDay()!==0)return x.toISOString().slice(0,10)}return''});
            await page.locator('input[name="data"]').fill(validDate);await page.locator('input[name="data"]').dispatchEvent('input');await page.locator('input[name="data"]').dispatchEvent('change');
            let online=false;
            try{await page.waitForFunction(()=>{const s=document.querySelector('select[name="periodo"]');return s&&s.dataset.calendarMode==='slots'&&!(s.textContent||'').includes('Consultando agenda')},null,{timeout:13000});online=true}catch{}
            const agendaState=await page.evaluate(()=>{const s=document.querySelector('select[name="periodo"]'),status=document.querySelector('[data-schedule-status]');return{mode:s?.dataset.calendarMode||'',options:s?[...s.options].map(o=>o.textContent):[],message:status?.textContent||'',ariaLive:status?.getAttribute('aria-live')||''}});
            evidence.agenda={status:res?.status(),runtime,constraints,sunday,validDate,online,...agendaState};
            if(res?.status()!==200)fail('Agenda','pagina HTTP diferente de 200');
            if(agendaState.ariaLive!=='polite')fail('Agenda','feedback perdeu aria-live');
            if(!online||agendaState.mode!=='slots')fail('Agenda backend','ponte Google Apps Script indisponivel; formulario caiu em fallback WhatsApp');
            if(runtime.some(x=>/403/.test(x)))fail('Agenda backend','Google Apps Script respondeu 403');
            await page.screenshot({path:'visual-qa/screenshots/acceptance-agenda.png',fullPage:true});
            await page.close();
          }

          // Formulario de contato: required e URL correta, sem abrir WhatsApp de verdade.
          {
            const page=await context.newPage();
            const runtime=[];page.on('pageerror',e=>runtime.push(e.message));page.on('console',m=>{if(m.type()==='error')runtime.push(m.text())});
            const res=await page.goto(base+'fale-conosco/?functional='+Date.now(),{waitUntil:'domcontentloaded',timeout:20000});await page.waitForTimeout(500);
            const form=page.locator('#contactForm');
            if(!(await form.count()))fail('Contato','formulario nao encontrado');
            else if(await form.evaluate(el=>el.checkValidity()))fail('Contato','formulario vazio foi considerado valido');
            await page.evaluate(()=>{window.open=url=>{window.__qaOpenedUrl=String(url);return{closed:false}}});
            await page.locator('#nome').fill('Teste QA Dorus');
            await page.locator('#problema').fill('Validacao automatica do formulario; nenhuma solicitacao deve ser enviada.');
            await page.locator('#contactForm button[type="submit"]').click();await page.waitForTimeout(150);
            const opened=await page.evaluate(()=>window.__qaOpenedUrl||'');
            evidence.contato={status:res?.status(),runtime,opened};
            if(res?.status()!==200)fail('Contato','HTTP diferente de 200');
            if(runtime.length)fail('Contato','erros de runtime: '+runtime.join(' | '));
            if(!opened.includes('wa.me/5511913573932'))fail('Contato','nao gerou URL correta do WhatsApp');
            await page.close();
          }

          await context.close();await browser.close();
          fs.writeFileSync('visual-qa/acceptance.json',JSON.stringify({evidence,failures},null,2));
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          console.log('OK: Home, agenda, formularios e acessibilidade validados.');
          EOF
          node functional-smoke.mjs

      - name: Salvar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-${{ github.run_id }}
          path: visual-qa/
          retention-days: 7
