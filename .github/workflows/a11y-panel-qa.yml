name: QA painel acessibilidade

on:
  push:
    branches: [main]
    paths:
      - 'accessibility.css'
      - 'accessibility-tools.js'
      - '.github/workflows/a11y-panel-qa.yml'

permissions:
  contents: read

jobs:
  painel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Aguardar Pages
        run: |
          VERSION="${GITHUB_SHA:0:12}"
          for i in $(seq 1 60); do
            HTML="$(curl -fsSL "https://kahcardim.github.io/Site-Dorus/?a11y=${GITHUB_SHA}&t=${i}" || true)"
            if printf '%s' "$HTML" | grep -q "?v=${VERSION}"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Testar painel aberto em web e mobile
        run: |
          mkdir -p a11y-qa
          cat > a11y-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const sizes=[['mobile-390',390,844],['desktop-1366',1366,768]];
          const report=[];
          for(const [name,width,height] of sizes){
            const context=await browser.newContext({viewport:{width,height}});
            const page=await context.newPage();
            await page.goto('https://kahcardim.github.io/Site-Dorus/?panel='+Date.now(),{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(1000);
            const cookie=page.locator('[data-cookie-essential]');
            if(await cookie.isVisible().catch(()=>false)) await cookie.click();
            const launcher=page.locator('[data-a11y-launcher]');
            await launcher.click();
            await page.waitForTimeout(250);
            const metrics=await page.locator('[data-a11y-panel]').evaluate((panel)=>{
              const r=panel.getBoundingClientRect();
              const s=getComputedStyle(panel);
              const buttons=[...panel.querySelectorAll('button')].map(b=>{const x=b.getBoundingClientRect();return {w:x.width,h:x.height,text:b.textContent.trim()}});
              const textNodes=[...panel.querySelectorAll('strong,p,button,span')].filter(e=>e.textContent.trim()).map(e=>({text:e.textContent.trim().slice(0,80),writingMode:getComputedStyle(e).writingMode,wordBreak:getComputedStyle(e).wordBreak,width:e.getBoundingClientRect().width}));
              return {left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height,display:s.display,writingMode:s.writingMode,overflowX:panel.scrollWidth-panel.clientWidth,buttons,textNodes};
            });
            const minWidth=name.startsWith('mobile')?width-30:320;
            const badText=metrics.textNodes.some(x=>x.writingMode!=='horizontal-tb'||x.width<38);
            const badButtons=metrics.buttons.some(x=>x.h<38||x.w<38);
            const outside=metrics.left<0||metrics.right>width+1||metrics.top<0||metrics.bottom>height+1;
            const failed=metrics.width<minWidth||metrics.overflowX>2||badText||badButtons||outside;
            report.push({name,width,height,metrics,minWidth,badText,badButtons,outside,failed});
            await page.screenshot({path:`a11y-qa/${name}.png`,fullPage:false});
            await context.close();
          }
          await browser.close();
          fs.writeFileSync('a11y-qa/report.json',JSON.stringify(report,null,2));
          if(report.some(x=>x.failed)){console.error(report);process.exit(1)}
          console.log(report);
          EOF
          node a11y-qa.mjs
      - name: Salvar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-panel-${{ github.run_id }}
          path: a11y-qa/
          retention-days: 3
