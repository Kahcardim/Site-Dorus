name: QA acessibilidade nativa e contraste

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acessibilidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Aguardar a mesma revisão no Pages
        run: |
          VERSION="${GITHUB_SHA:0:12}"
          for i in $(seq 1 60); do
            HTML="$(curl -fsSL "https://assistenciadorus.com.br/?a11y=${GITHUB_SHA}&t=${i}" || true)"
            if printf '%s' "$HTML" | grep -q "?v=${VERSION}"; then
              echo "Pages confirmado em ${VERSION}."
              exit 0
            fi
            sleep 5
          done
          echo "Pages não apresentou a revisão ${VERSION}."
          exit 1
      - name: Testar preferências nativas, teclado e menu
        run: |
          mkdir -p a11y-qa
          cat > a11y-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const scenarios=[
            ['mobile-reduced-forced',390,844,'reduce','active'],
            ['desktop-reduced-forced',1366,768,'reduce','active'],
            ['mobile-default',390,844,'no-preference','none'],
            ['desktop-default',1366,768,'no-preference','none']
          ];
          const report=[];
          for(const [name,width,height,reducedMotion,forcedColors] of scenarios){
            const context=await browser.newContext({viewport:{width,height},reducedMotion,forcedColors});
            const page=await context.newPage();
            const runtime=[];
            page.on('pageerror',e=>runtime.push(e.message));
            await page.goto('https://assistenciadorus.com.br/?nativea11y='+Date.now(),{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(900);
            const cookie=page.locator('[data-cookie-essential]');
            if(await cookie.isVisible().catch(()=>false))await cookie.click();
            const metrics=await page.evaluate(()=>({
              ready:document.documentElement.dataset.a11yNative,
              reduced:document.documentElement.dataset.a11yReducedMotion,
              forced:document.documentElement.dataset.a11yForcedColors,
              widget:document.querySelectorAll('.a11y-tools,[data-a11y-launcher]').length,
              overflow:Math.max(document.documentElement.scrollWidth,document.body.scrollWidth)-innerWidth,
              skip:!!document.querySelector('.skip-link[href="#conteudo"]'),
              main:!!document.querySelector('main#conteudo')
            }));
            const reasons=[];
            if(metrics.ready!=='ready')reasons.push('camada nativa não inicializou');
            if(metrics.widget!==0)reasons.push('widget legado ainda visível');
            if(metrics.overflow>1)reasons.push(`overflow horizontal: ${metrics.overflow}px`);
            if(!metrics.skip||!metrics.main)reasons.push('skip-link ou destino principal ausente');
            if(reducedMotion==='reduce'&&metrics.reduced!=='true')reasons.push('redução de movimento não refletida');
            if(forcedColors==='active'&&metrics.forced!=='true')reasons.push('cores forçadas não refletidas');
            if(name.startsWith('mobile')){
              await page.evaluate(()=>window.scrollTo(0,document.body.scrollHeight));
              await page.locator('.mobile-nav summary').click();
              const nav=await page.locator('.mobile-nav a').evaluateAll(links=>links.map(a=>{const r=a.getBoundingClientRect(),s=getComputedStyle(a);return {visible:s.display!=='none'&&s.visibility!=='hidden'&&r.width>20&&r.height>20}}));
              const headerTop=await page.locator('.header').evaluate(e=>Math.round(e.getBoundingClientRect().top));
              if(nav.filter(x=>x.visible).length<5||headerTop!==0)reasons.push('menu móvel não permaneceu utilizável durante a rolagem');
            }
            await page.keyboard.press('Tab');
            const focusVisible=await page.evaluate(()=>document.activeElement&&document.activeElement.matches(':focus-visible'));
            if(!focusVisible)reasons.push('foco de teclado não visível');
            await page.screenshot({path:`a11y-qa/${name}.png`,fullPage:false});
            report.push({name,width,height,reducedMotion,forcedColors,metrics,runtime,reasons,failed:reasons.length>0||runtime.length>0});
            await context.close();
          }
          await browser.close();
          fs.writeFileSync('a11y-qa/report.json',JSON.stringify(report,null,2));
          if(report.some(x=>x.failed)){console.error(JSON.stringify(report,null,2));process.exit(1)}
          console.log('OK: preferências nativas, teclado e menu móvel validados.');
          EOF
          node a11y-qa.mjs
      - name: Salvar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-native-${{ github.run_id }}
          path: a11y-qa/
          retention-days: 7
