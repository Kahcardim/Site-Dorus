name: QA acessibilidade e contraste

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acessibilidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Aguardar a mesma revisao no Pages
        run: |
          VERSION="${GITHUB_SHA:0:12}"
          for i in $(seq 1 60); do
            HTML="$(curl -fsSL "https://assistenciadorus.com.br/?a11y=${GITHUB_SHA}&t=${i}" || true)"
            if printf '%s' "$HTML" | grep -q "?v=${VERSION}"; then
              echo "Pages confirmado em ${VERSION}."
              exit 0
            fi
            sleep 5
          done
          echo "Pages nao apresentou a revisao ${VERSION}."
          exit 1
      - name: Testar painel e navegacao em alto contraste
        run: |
          mkdir -p a11y-qa
          cat > a11y-qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const sizes=[['mobile-390',390,844],['desktop-1366',1366,768]];
          const report=[];
          for(const [name,width,height] of sizes){
            const context=await browser.newContext({viewport:{width,height}});
            const page=await context.newPage();
            await page.goto('https://assistenciadorus.com.br/?contrast='+Date.now(),{waitUntil:'domcontentloaded'});
            await page.waitForTimeout(900);
            const cookie=page.locator('[data-cookie-essential]');
            if(await cookie.isVisible().catch(()=>false)) await cookie.click();
            await page.locator('[data-a11y-launcher]').click();
            await page.locator('[data-a11y-contrast]').click();
            await page.waitForTimeout(150);
            const panelMetrics=await page.locator('[data-a11y-panel]').evaluate(panel=>{
              const r=panel.getBoundingClientRect();
              return {left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,overflowX:panel.scrollWidth-panel.clientWidth};
            });
            const panelOutside=panelMetrics.left<0||panelMetrics.right>width+1||panelMetrics.top<0||panelMetrics.bottom>height+1||panelMetrics.overflowX>2;
            await page.locator('[data-a11y-close]').click();
            let nav;
            if(name.startsWith('mobile')){
              const summary=page.locator('.mobile-nav summary');
              await summary.click();
              nav=await page.locator('.mobile-nav a').evaluateAll(links=>links.map(a=>{const r=a.getBoundingClientRect(),s=getComputedStyle(a);return {text:a.textContent.trim(),display:s.display,visibility:s.visibility,opacity:s.opacity,color:s.color,background:s.backgroundColor,w:r.width,h:r.height}}));
            }else{
              nav=await page.locator('.nav a').evaluateAll(links=>links.map(a=>{const r=a.getBoundingClientRect(),s=getComputedStyle(a);return {text:a.textContent.trim(),display:s.display,visibility:s.visibility,opacity:s.opacity,color:s.color,background:s.backgroundColor,w:r.width,h:r.height}}));
            }
            const visibleNav=nav.filter(x=>x.display!=='none'&&x.visibility!=='hidden'&&Number(x.opacity)>0&&x.w>20&&x.h>10);
            const menuFailed=visibleNav.length<5||visibleNav.some(x=>x.color==='rgb(0, 0, 0)');
            const highContrast=await page.evaluate(()=>document.documentElement.classList.contains('a11y-high-contrast'));
            const failed=panelOutside||menuFailed||!highContrast;
            report.push({name,width,height,panelMetrics,panelOutside,visibleNav,menuFailed,highContrast,failed});
            await page.screenshot({path:`a11y-qa/${name}-contraste.png`,fullPage:false});
            await context.close();
          }
          await browser.close();
          fs.writeFileSync('a11y-qa/report.json',JSON.stringify(report,null,2));
          if(report.some(x=>x.failed)){console.error(JSON.stringify(report,null,2));process.exit(1)}
          console.log('OK: painel e menus permanecem visiveis em alto contraste.');
          EOF
          node a11y-qa.mjs
      - name: Salvar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-contrast-${{ github.run_id }}
          path: a11y-qa/
          retention-days: 7
