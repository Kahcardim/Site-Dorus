name: QA acessibilidade nativa

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Servir build
        run: |
          python3 -m http.server 4174 --directory dist --bind 127.0.0.1 > /tmp/dorus-native-a11y.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4174/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: node scripts/test-native-a11y.mjs
      - name: Salvar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-a11y-${{ github.run_id }}
          path: test-results/native-a11y/
          retention-days: 14
