name: QA usabilidade real - severidade alta

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-usability:
    name: Usabilidade real - HIGH
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Servir a revisão localmente
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/dorus-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/dorus-http.log || true
          exit 1

      - name: Validar todas as páginas em uso real
        shell: bash
        run: |
          mkdir -p real-usability/screenshots
          cat > real-usability.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const base='http://127.0.0.1:4173';
          const sitemap=fs.readFileSync('sitemap.xml','utf8');
          const paths=[...sitemap.matchAll(/<loc>https:\/\/assistenciadorus\.com\.br([^<]*)<\/loc>/g)]
            .map(m=>m[1]||'/').map(p=>p.startsWith('/')?p:'/'+p);
          if(!paths.includes('/')) paths.unshift('/');
          const pages=[...new Set(paths)];
          const sizes=[
            ['mobile-360',360,800],['mobile-390',390,844],['tablet-768',768,1024],
            ['tablet-landscape-1024',1024,768],['laptop-1280',1280,720],
            ['desktop-1366',1366,768],['desktop-1920',1920,1080]
          ];
          const screenshotSizes=new Set(['mobile-390','tablet-768','desktop-1366','desktop-1920']);
          const browser=await chromium.launch({headless:true});
          const report=[],failures=[],externalSignals=[];

          const shortPath=p=>p==='/'?'home':p.replace(/^\//,'').replace(/\/$/,'').replace(/\//g,'--');

          async function inspect(page,path){
            return page.evaluate(({path})=>{
              const visible=e=>{if(!e)return false;const s=getComputedStyle(e),r=e.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&+s.opacity!==0&&r.width>0&&r.height>0};
              const vw=innerWidth;
              const docWidth=Math.max(document.documentElement.scrollWidth,document.body.scrollWidth);
              const overflowX=Math.max(0,Math.round(docWidth-vw));
              const intentional=e=>!!e.closest('.review-carousel,.logo-marquee');

              const offscreen=[];
              document.querySelectorAll('main .container,main .card,main .trust-card,main .step,main .tip-card,main .service-card,main .contact-item,main .form,main .schedule-box,main .content-grid > *,main .values > *,main .cards > *,main .service-grid > *').forEach(e=>{
                if(!visible(e)||intentional(e))return;
                const r=e.getBoundingClientRect();
                if(r.left<-1||r.right>vw+1)offscreen.push({tag:e.tagName,cls:e.className,left:Math.round(r.left),right:Math.round(r.right)});
              });

              const clippedText=[];
              document.querySelectorAll('main h1,main h2,main h3,main h4,main p,main a,main strong,main small,main label,main summary,main button').forEach(e=>{
                if(!visible(e)||!e.textContent.trim())return;
                const s=getComputedStyle(e),clips=/(hidden|clip)/.test(`${s.overflow} ${s.overflowX} ${s.overflowY}`);
                if(clips&&(e.scrollWidth>e.clientWidth+2||e.scrollHeight>e.clientHeight+2))clippedText.push(e.textContent.trim().replace(/\s+/g,' ').slice(0,90));
              });

              const brokenImages=[...document.images].filter(i=>visible(i)&&i.complete&&i.naturalWidth===0).map(i=>i.currentSrc||i.src);
              const accidentalScroll=[];
              document.querySelectorAll('.content-grid,.values,.cards,.trust-grid,.steps,.service-grid,.contact-grid,.schedule-layout').forEach(e=>{
                if(visible(e)&&e.scrollWidth>e.clientWidth+2)accidentalScroll.push({cls:e.className,client:e.clientWidth,scroll:e.scrollWidth});
              });

              const interactiveOffscreen=[];
              document.querySelectorAll('main button,main input,main select,main textarea,main .button,.mobile-nav summary').forEach(e=>{
                if(!visible(e))return;const r=e.getBoundingClientRect();if(r.left<-1||r.right>vw+1)interactiveOffscreen.push({tag:e.tagName,cls:e.className});
              });

              const tinyTargets=[];
              if(vw<=480)document.querySelectorAll('.button,.whatsapp-float,.mobile-nav summary,[data-a11y-launcher]').forEach(e=>{
                if(!visible(e))return;const r=e.getBoundingClientRect();if(r.width<40||r.height<40)tinyTargets.push({tag:e.tagName,cls:e.className,w:Math.round(r.width),h:Math.round(r.height)});
              });

              let brandCarousel=null,reviewPresentation=null;
              if(path==='/'){
                const shell=document.querySelector('.logo-marquee-shell');
                const marquee=document.querySelector('[data-logo-marquee]');
                const track=document.querySelector('.logo-track');
                const toggle=document.querySelector('[data-logo-toggle]');
                const firstSet=document.querySelector('.logo-set:not([aria-hidden="true"])');
                const brands=firstSet?[...firstSet.querySelectorAll('.brand-logo')].filter(visible):[];
                brandCarousel={
                  shell:visible(shell),marquee:visible(marquee),track:visible(track),toggle:visible(toggle),
                  brandCount:brands.length,
                  scrollable:!!marquee&&marquee.scrollWidth>marquee.clientWidth+10,
                  flexTrack:!!track&&getComputedStyle(track).display==='flex',
                  shellWithinViewport:!!shell&&shell.getBoundingClientRect().left>=-1&&shell.getBoundingClientRect().right<=vw+1
                };

                const reviews=document.querySelector('.review-carousel');
                const reviewCards=reviews?[...reviews.querySelectorAll('.review-card')].filter(visible):[];
                const rr=reviews?.getBoundingClientRect();
                const fullyVisible=reviewCards.filter(c=>{const r=c.getBoundingClientRect();return r.right>rr.left&&r.left<rr.right&&r.left>=rr.left-1&&r.right<=rr.right+1}).length;
                reviewPresentation={exists:visible(reviews),count:reviewCards.length,fullyVisible,withinViewport:!!rr&&rr.left>=-1&&rr.right<=vw+1};
              }

              return {
                overflowX,offscreen,clippedText,brokenImages,accidentalScroll,interactiveOffscreen,tinyTargets,
                h1s:[...document.querySelectorAll('main h1')].filter(visible).length,
                header:visible(document.querySelector('.header')),footer:visible(document.querySelector('.footer')),main:visible(document.querySelector('main')),
                brandCarousel,reviewPresentation
              };
            },{path});
          }

          for(const [size,w,h] of sizes){
            const context=await browser.newContext({viewport:{width:w,height:h}});
            for(const path of pages){
              const page=await context.newPage();
              const runtime=[],externalRuntime=[];
              page.on('pageerror',e=>runtime.push(`pageerror: ${e.message}`));
              page.on('console',m=>{
                if(m.type()!=='error')return;const text=m.text();
                if(path==='/agendamento/'&&/403/.test(text)){externalRuntime.push(text);return;}
                runtime.push(text);
              });
              let status=0;
              try{
                const res=await page.goto(base+path+'?realux='+Date.now(),{waitUntil:'domcontentloaded',timeout:20000});status=res?.status()||0;
                await page.waitForTimeout(800);
                const essential=page.locator('[data-cookie-essential]');if(await essential.isVisible().catch(()=>false))await essential.click();
                if(path==='/'){
                  const toggle=page.locator('[data-logo-toggle]');if(await toggle.isVisible().catch(()=>false))await toggle.click();
                }
                await page.waitForTimeout(150);
              }catch(e){runtime.push(`navigation: ${e.message}`)}

              const m=await inspect(page,path),reasons=[];
              if(status!==200)reasons.push(`HTTP ${status}`);
              if(runtime.length)reasons.push(`runtime ${runtime.join(' | ')}`);
              if(m.overflowX>1)reasons.push(`overflow horizontal ${m.overflowX}px`);
              if(m.offscreen.length)reasons.push(`blocos fora da viewport: ${m.offscreen.length}`);
              if(m.clippedText.length)reasons.push(`texto cortado: ${m.clippedText.length}`);
              if(m.brokenImages.length)reasons.push(`imagens quebradas: ${m.brokenImages.length}`);
              if(m.accidentalScroll.length)reasons.push(`rolagem horizontal acidental: ${m.accidentalScroll.length}`);
              if(m.interactiveOffscreen.length)reasons.push(`controles fora da viewport: ${m.interactiveOffscreen.length}`);
              if(m.tinyTargets.length)reasons.push(`alvos de toque menores que 40px: ${m.tinyTargets.length}`);
              if(m.h1s!==1)reasons.push(`H1 visível esperado 1, encontrado ${m.h1s}`);
              if(!m.header||!m.footer||!m.main)reasons.push('estrutura principal invisível');
              if(path==='/'){
                const b=m.brandCarousel;
                if(!b?.shell||!b?.marquee||!b?.track||!b?.toggle||b.brandCount<8||!b.scrollable||!b.flexTrack||!b.shellWithinViewport)reasons.push('carrossel de marcas ausente, substituído ou fora do padrão');
                const r=m.reviewPresentation;
                if(!r?.exists||r.count<3||r.fullyVisible<1||!r.withinViewport)reasons.push('avaliações sem apresentação utilizável');
              }

              const row={severity:'HIGH',size,width:w,height:h,path,status,runtime,externalRuntime,...m,failed:reasons.length>0,reasons};report.push(row);if(row.failed)failures.push(row);if(externalRuntime.length)externalSignals.push({size,path,externalRuntime});
              if(screenshotSizes.has(size))await page.screenshot({path:`real-usability/screenshots/${size}-${shortPath(path)}.png`,fullPage:true});

              if(size==='mobile-390'||size==='desktop-1366'){
                await page.evaluate(()=>document.documentElement.style.setProperty('--user-font-scale','1.3'));await page.waitForTimeout(100);
                const large=await inspect(page,path),largeReasons=[];
                if(large.overflowX>1)largeReasons.push(`overflow com fonte ampliada ${large.overflowX}px`);
                if(large.offscreen.length)largeReasons.push(`blocos fora da viewport com fonte ampliada: ${large.offscreen.length}`);
                if(large.clippedText.length)largeReasons.push(`texto cortado com fonte ampliada: ${large.clippedText.length}`);
                if(large.accidentalScroll.length)largeReasons.push(`rolagem horizontal acidental com fonte ampliada: ${large.accidentalScroll.length}`);
                const lr={severity:'HIGH',mode:'130-percent-text',size,width:w,height:h,path,...large,failed:largeReasons.length>0,reasons:largeReasons};report.push(lr);if(lr.failed)failures.push(lr);
              }
              await page.close();
            }
            await context.close();
          }

          await browser.close();
          fs.writeFileSync('real-usability/report.json',JSON.stringify(report,null,2));
          fs.writeFileSync('real-usability/high-severity-failures.json',JSON.stringify(failures,null,2));
          fs.writeFileSync('real-usability/external-backend-signals.json',JSON.stringify(externalSignals,null,2));
          const summary=`# QA de usabilidade real — severidade alta\n\nPáginas no sitemap: ${pages.length}\nCenários executados: ${report.length}\nFalhas HIGH: ${failures.length}\nSinais externos de backend: ${externalSignals.length}\n\nCarrosséis intencionais são aceitos; overflow acidental, componentes substituídos e conteúdo quebrado continuam reprovando.`;
          fs.writeFileSync('real-usability/summary.md',summary);console.log(summary);
          if(failures.length){failures.slice(0,40).forEach(f=>console.error(`${f.size} ${f.path}: ${f.reasons.join('; ')}`));process.exit(1);}
          EOF
          node real-usability.mjs

      - name: Publicar resumo no job
        if: always()
        run: cat real-usability/summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Salvar evidências visuais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-usability-high-${{ github.run_id }}
          path: real-usability/
          retention-days: 7
