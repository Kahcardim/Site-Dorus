name: QA usabilidade real - severidade alta

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - 'assets/**'
      - 'sitemap.xml'
      - '.github/workflows/real-usability-qa.yml'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - 'assets/**'
      - 'sitemap.xml'
      - '.github/workflows/real-usability-qa.yml'

permissions:
  contents: read

jobs:
  real-usability:
    name: Usabilidade real - HIGH
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Servir a revisão localmente
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/dorus-http.log 2>&1 &
          echo $! > /tmp/dorus-http.pid
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              echo 'Site local pronto.'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dorus-http.log || true
          exit 1

      - name: Validar todas as páginas em uso real
        shell: bash
        run: |
          mkdir -p real-usability/screenshots
          cat > real-usability.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const base='http://127.0.0.1:4173';
          const sitemap=fs.readFileSync('sitemap.xml','utf8');
          const paths=[...sitemap.matchAll(/<loc>https:\/\/assistenciadorus\.com\.br([^<]*)<\/loc>/g)]
            .map(m=>m[1]||'/')
            .map(p=>p.startsWith('/')?p:'/'+p);
          if(!paths.includes('/')) paths.unshift('/');
          const pages=[...new Set(paths)];

          const sizes=[
            ['mobile-360',360,800],
            ['mobile-390',390,844],
            ['tablet-768',768,1024],
            ['tablet-landscape-1024',1024,768],
            ['laptop-1280',1280,720],
            ['desktop-1366',1366,768],
            ['desktop-1920',1920,1080]
          ];
          const screenshotSizes=new Set(['mobile-390','tablet-768','desktop-1366']);
          const browser=await chromium.launch({headless:true});
          const report=[];
          const failures=[];
          const externalSignals=[];

          function shortPath(path){
            if(path==='/') return 'home';
            return path.replace(/^\//,'').replace(/\/$/,'').replace(/\//g,'--')||'home';
          }

          async function inspect(page){
            return page.evaluate(()=>{
              const visible=e=>{
                if(!e) return false;
                const s=getComputedStyle(e),r=e.getBoundingClientRect();
                return s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity)!==0&&r.width>0&&r.height>0;
              };
              const rect=e=>{const r=e.getBoundingClientRect();return{left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height}};
              const vw=innerWidth;
              const docWidth=Math.max(document.documentElement.scrollWidth,document.body.scrollWidth);
              const overflowX=Math.max(0,Math.round(docWidth-vw));

              const offscreen=[];
              const boxSelectors=[
                'main .container','main .card','main .review-card','main .trust-card','main .step',
                'main .tip-card','main .service-card','main .contact-item','main .form','main .schedule-box',
                'main .content-grid > *','main .values > *','main .cards > *','main .service-grid > *'
              ].join(',');
              document.querySelectorAll(boxSelectors).forEach(e=>{
                if(!visible(e)) return;
                const r=rect(e);
                if(r.left < -1 || r.right > vw+1) offscreen.push({tag:e.tagName,cls:e.className,left:Math.round(r.left),right:Math.round(r.right),vw});
              });

              const clippedText=[];
              document.querySelectorAll('main h1,main h2,main h3,main h4,main p,main a,main strong,main small,main label,main summary,main button').forEach(e=>{
                if(!visible(e)||!e.textContent.trim()) return;
                const s=getComputedStyle(e);
                const clips=/(hidden|clip)/.test(`${s.overflow} ${s.overflowX} ${s.overflowY}`);
                if(clips&&(e.scrollWidth>e.clientWidth+2||e.scrollHeight>e.clientHeight+2)){
                  clippedText.push(e.textContent.trim().replace(/\s+/g,' ').slice(0,100));
                }
              });

              const brokenHeadingWords=[];
              document.querySelectorAll('main h1,main h2,main h3').forEach(el=>{
                if(!visible(el)) return;
                const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
                let node;
                while((node=walker.nextNode())){
                  const text=node.nodeValue||'';
                  const re=/\S+/g;
                  let match;
                  while((match=re.exec(text))){
                    const word=match[0].replace(/[.,;:!?()]/g,'');
                    if(word.length<7) continue;
                    const range=document.createRange();
                    range.setStart(node,match.index);
                    range.setEnd(node,match.index+match[0].length);
                    const rects=[...range.getClientRects()].filter(r=>r.width>0&&r.height>0);
                    const lines=[...new Set(rects.map(r=>Math.round(r.top)))];
                    if(lines.length>1) brokenHeadingWords.push(word);
                  }
                }
              });

              const brokenImages=[...document.images]
                .filter(i=>visible(i)&&i.complete&&i.naturalWidth===0)
                .map(i=>i.currentSrc||i.src);

              const horizontalScroll=[];
              document.querySelectorAll('.review-carousel,.content-grid,.values,.cards,.trust-grid,.steps,.service-grid,.contact-grid,.schedule-layout').forEach(e=>{
                if(!visible(e)) return;
                if(e.scrollWidth>e.clientWidth+2) horizontalScroll.push({cls:e.className,client:e.clientWidth,scroll:e.scrollWidth});
              });

              function partialChildren(parentSelector,childSelector){
                const parent=document.querySelector(parentSelector);
                if(!visible(parent)) return [];
                const pr=parent.getBoundingClientRect();
                return [...parent.querySelectorAll(childSelector)].filter(visible).map(e=>{
                  const r=e.getBoundingClientRect();
                  return {text:(e.textContent||'').trim().replace(/\s+/g,' ').slice(0,60),left:Math.round(r.left),right:Math.round(r.right),parentLeft:Math.round(pr.left),parentRight:Math.round(pr.right)};
                }).filter(x=>x.left<pr.left-1||x.right>pr.right+1);
              }

              const partialReviews=partialChildren('.review-carousel','.review-card');

              const marquee=document.querySelector('.logo-marquee');
              const primarySet=document.querySelector('.logo-set:not([aria-hidden="true"])');
              const brandCarousel=marquee?{
                visible:visible(marquee),
                cards:primarySet?[...primarySet.querySelectorAll('.brand-logo')].filter(visible).length:0,
                scrollable:marquee.scrollWidth>marquee.clientWidth+20,
                scrollLeft:Math.round(marquee.scrollLeft),
                control:visible(document.querySelector('[data-logo-toggle]'))
              }:null;

              const interactiveOffscreen=[];
              document.querySelectorAll('main button,main input,main select,main textarea,main .button,.mobile-nav summary').forEach(e=>{
                if(!visible(e)) return;
                const r=e.getBoundingClientRect();
                if(r.left < -1 || r.right > vw+1) interactiveOffscreen.push({tag:e.tagName,cls:e.className,left:Math.round(r.left),right:Math.round(r.right)});
              });

              const tinyTargets=[];
              if(vw<=480){
                document.querySelectorAll('.button,.whatsapp-float,.mobile-nav summary,[data-a11y-launcher],[data-logo-toggle]').forEach(e=>{
                  if(!visible(e)) return;
                  const r=e.getBoundingClientRect();
                  if(r.width<40||r.height<40) tinyTargets.push({tag:e.tagName,cls:e.className,w:Math.round(r.width),h:Math.round(r.height)});
                });
              }

              const h1s=[...document.querySelectorAll('main h1')].filter(visible).length;
              const header=visible(document.querySelector('.header'));
              const footer=visible(document.querySelector('.footer'));
              const main=visible(document.querySelector('main'));
              const reviewCount=[...document.querySelectorAll('.review-card')].filter(visible).length;

              return {overflowX,offscreen,clippedText,brokenHeadingWords,brokenImages,horizontalScroll,partialReviews,interactiveOffscreen,tinyTargets,h1s,header,footer,main,reviewCount,brandCarousel};
            });
          }

          for(const [size,w,h] of sizes){
            const context=await browser.newContext({viewport:{width:w,height:h}});
            for(const path of pages){
              const page=await context.newPage();
              const runtime=[];
              const externalRuntime=[];
              page.on('pageerror',e=>runtime.push(`pageerror: ${e.message}`));
              page.on('console',m=>{
                if(m.type()!=='error') return;
                const text=m.text();
                if(path==='/agendamento/'&&/403/.test(text)){
                  externalRuntime.push(`console: ${text}`);
                  return;
                }
                runtime.push(`console: ${text}`);
              });
              let status=0;
              try{
                const res=await page.goto(base+path+'?realux='+Date.now(),{waitUntil:'domcontentloaded',timeout:20000});
                status=res?.status()||0;
                await page.waitForTimeout(700);
                const essential=page.locator('[data-cookie-essential]');
                if(await essential.isVisible().catch(()=>false)) await essential.click();
                if(path==='/'){
                  const marquee=page.locator('.logo-marquee');
                  if(await marquee.isVisible().catch(()=>false)){
                    await marquee.scrollIntoViewIfNeeded();
                    await page.waitForTimeout(700);
                  }
                }
                await page.waitForTimeout(150);
              }catch(e){runtime.push(`navigation: ${e.message}`)}

              const metrics=await inspect(page);
              const reasons=[];
              if(status!==200) reasons.push(`HTTP ${status}`);
              if(runtime.length) reasons.push(`runtime ${runtime.join(' | ')}`);
              if(metrics.overflowX>1) reasons.push(`overflow horizontal ${metrics.overflowX}px`);
              if(metrics.offscreen.length) reasons.push(`blocos fora da viewport: ${metrics.offscreen.length}`);
              if(metrics.clippedText.length) reasons.push(`texto cortado: ${metrics.clippedText.length}`);
              if(metrics.brokenHeadingWords.length) reasons.push(`palavras quebradas em títulos: ${metrics.brokenHeadingWords.join(', ')}`);
              if(metrics.brokenImages.length) reasons.push(`imagens quebradas: ${metrics.brokenImages.length}`);
              if(metrics.horizontalScroll.length) reasons.push(`área principal exige rolagem horizontal: ${metrics.horizontalScroll.length}`);
              if(metrics.partialReviews.length) reasons.push(`avaliações parcialmente cortadas: ${metrics.partialReviews.length}`);
              if(metrics.interactiveOffscreen.length) reasons.push(`controles fora da viewport: ${metrics.interactiveOffscreen.length}`);
              if(metrics.tinyTargets.length) reasons.push(`alvos de toque menores que 40px: ${metrics.tinyTargets.length}`);
              if(metrics.h1s!==1) reasons.push(`H1 visível esperado 1, encontrado ${metrics.h1s}`);
              if(!metrics.header||!metrics.footer||!metrics.main) reasons.push('estrutura principal invisível');
              if(path==='/'){
                if(!metrics.brandCarousel?.visible) reasons.push('carrossel de marcas invisível');
                if((metrics.brandCarousel?.cards||0)<6) reasons.push(`carrossel com poucas marcas: ${metrics.brandCarousel?.cards||0}`);
                if(!metrics.brandCarousel?.scrollable) reasons.push('carrossel de marcas não possui faixa navegável');
                if(!metrics.brandCarousel?.control) reasons.push('controle do carrossel de marcas invisível');
                if((metrics.brandCarousel?.scrollLeft||0)<=0) reasons.push('carrossel de marcas não iniciou movimento');
              }

              const row={severity:'HIGH',size,width:w,height:h,path,status,runtime,externalRuntime,...metrics,failed:reasons.length>0,reasons};
              report.push(row);
              if(row.failed) failures.push(row);
              if(externalRuntime.length) externalSignals.push({size,path,externalRuntime});

              if(screenshotSizes.has(size)){
                await page.screenshot({path:`real-usability/screenshots/${size}-${shortPath(path)}.png`,fullPage:true});
              }

              if(size==='mobile-390'||size==='desktop-1366'){
                await page.evaluate(()=>document.documentElement.style.setProperty('--user-font-scale','1.3'));
                await page.waitForTimeout(120);
                const large=await inspect(page);
                const largeReasons=[];
                if(large.overflowX>1) largeReasons.push(`overflow com fonte ampliada ${large.overflowX}px`);
                if(large.offscreen.length) largeReasons.push(`blocos fora da viewport com fonte ampliada: ${large.offscreen.length}`);
                if(large.clippedText.length) largeReasons.push(`texto cortado com fonte ampliada: ${large.clippedText.length}`);
                if(large.brokenHeadingWords.length) largeReasons.push(`palavras quebradas em títulos com fonte ampliada: ${large.brokenHeadingWords.join(', ')}`);
                if(large.horizontalScroll.length) largeReasons.push(`rolagem horizontal com fonte ampliada: ${large.horizontalScroll.length}`);
                if(large.partialReviews.length) largeReasons.push(`avaliações cortadas com fonte ampliada: ${large.partialReviews.length}`);
                const largeRow={severity:'HIGH',mode:'130-percent-text',size,width:w,height:h,path,...large,failed:largeReasons.length>0,reasons:largeReasons};
                report.push(largeRow);
                if(largeRow.failed) failures.push(largeRow);
              }

              await page.close();
            }
            await context.close();
          }

          await browser.close();
          fs.writeFileSync('real-usability/report.json',JSON.stringify(report,null,2));
          fs.writeFileSync('real-usability/high-severity-failures.json',JSON.stringify(failures,null,2));
          fs.writeFileSync('real-usability/external-backend-signals.json',JSON.stringify(externalSignals,null,2));

          const summary=[
            '# QA de usabilidade real — severidade alta',
            '',
            `Páginas no sitemap: ${pages.length}`,
            `Cenários executados: ${report.length}`,
            `Falhas HIGH de usabilidade: ${failures.length}`,
            `Sinais externos de backend: ${externalSignals.length}`,
            '',
            'Critérios: sem overflow acidental, avaliações inteiras, títulos sem palavras partidas, carrossel de marcas funcional, imagens válidas, controles acessíveis e fonte a 130% sem quebra.'
          ].join('\n');
          fs.writeFileSync('real-usability/summary.md',summary);
          console.log(summary);
          if(externalSignals.length) console.warn(`Backend externo sinalizado em ${externalSignals.length} cenário(s); não altera o resultado visual.`);
          if(failures.length){
            console.error('\nFalhas HIGH:');
            failures.slice(0,40).forEach(f=>console.error(`${f.size} ${f.path}: ${f.reasons.join('; ')}`));
            process.exit(1);
          }
          EOF
          node real-usability.mjs

      - name: Publicar resumo no job
        if: always()
        shell: bash
        run: |
          if [ -f real-usability/summary.md ]; then cat real-usability/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Salvar evidências visuais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-usability-high-${{ github.run_id }}
          path: real-usability/
          retention-days: 7
